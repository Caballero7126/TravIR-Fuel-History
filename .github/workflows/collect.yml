name: Automatic retailer fuel history

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: retailer-history
  cancel-in-progress: false

jobs:
  collect:
    # A public data repository uses the standard free Linux runner. This workflow
    # does not run in TravIR's private app repository or access Apple/Google keys.
    if: github.event.repository.private == false && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out public observations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify collector source
        run: |
          python3 - <<'PY'
          import hashlib,pathlib,zipfile
          source=pathlib.Path('collector.zip')
          assert hashlib.sha256(source.read_bytes()).hexdigest()=='44357e70b9f61f2518f184371052fa0687080ea3229b8e3c64327a762a86033f', 'Collector differs from reviewed code'
          with zipfile.ZipFile(source) as archive:
              assert len(archive.infolist())<=10
              for item in archive.infolist():
                  path=pathlib.PurePosixPath(item.filename)
                  assert not path.is_absolute() and '..' not in path.parts and '\\' not in item.filename and item.file_size<1000000
              archive.extractall('.collector')
          PY
          python3 -m venv .runtime
          .runtime/bin/pip install --disable-pip-version-check --no-input -r .collector/requirements.txt
      - name: Verify station, grade, timezone and missing-history safeguards
        working-directory: .collector
        run: ../.runtime/bin/python -m unittest -v test_collect
      - name: Collect automatic public retailer observations
        run: .runtime/bin/python .collector/collect.py --state retailer-history.json --output fuel-history.json
      - name: Publish price data only
        run: |
          git config user.name 'TravIR data collector'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- retailer-history.json fuel-history.json collection-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update automatic retailer observations'
          git push origin HEAD:main
